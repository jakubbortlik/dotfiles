git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --line-numbers --syntax-theme gruvbox-dark
    - colorArg: always
      command: delta --paging=never --side-by-side --line-numbers --syntax-theme gruvbox-dark
os:
  editPreset: "nvim-remote"
gui:
  showFileTree: false
  nerdFontsVersion: "3"
  theme:
    optionsTextColor:
      - "#7e9cd8"
    inactiveBorderColor:
      - "#2d4f67"
    defaultFgColor:
      - "#dcd7ba"
    cherryPickedCommitFgColor:
      - "#7e9cd8"
    cherryPickedCommitBgColor:
      - "#e6c384"
    activeBorderColor:
      - "#ff9e3b"
      - "bold"
    unstagedChangesColor:
      - "#e82424"
    selectedLineBgColor:
      - "#223249"
    searchingActiveBorderColor:
      - "#ff9e3b"
      - "bold"
customCommands:
  - key: '<space>'
    context: 'files'
    command: >
      git {{if .SelectedFile.HasUnstagedChanges}}add{{else}}reset{{end}} -- {{.SelectedFile.Name | quote}} && tmux send-keys -t "$TMUX_PANE" 'j'

    description: 'Toggle staged and move down'
    output: none
